<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>MyStuff · Password</title>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<!-- PasswordPage, viewing a saved item: ItemPageScaffold + ItemHeader + FieldTiles. -->
<div class="appbar">
  <span class="btn40"><i data-icon="arrow_back"></i></span>
  <span class="appbar-title">Gmail</span>
  <span class="grow"></span>
  <span class="btn40 star-on"><i data-icon="star"></i></span>
  <span class="btn40"><i data-icon="more_horiz"></i></span>
</div>

<div class="fields">
  <div class="item-head">
    <span class="avatar" data-size="58" data-color="#2563eb">G</span>
    <span class="text"><b>Gmail</b><span class="body-small">Social</span></span>
  </div>

  <div class="field">
    <span class="text"><span class="label label-small">Username</span><span class="value">you@gmail.com</span></span>
    <span class="act"><i data-icon="content_copy"></i></span>
  </div>
  <div class="field">
    <span class="text"><span class="label label-small">Password</span><span class="value secret">••••••••••••</span></span>
    <span class="act"><i data-icon="visibility_outlined"></i></span>
    <span class="act"><i data-icon="content_copy"></i></span>
  </div>
  <div class="field">
    <span class="text"><span class="label label-small">Website</span><span class="value">mail.google.com</span></span>
    <span class="act"><i data-icon="open_in_new"></i></span>
  </div>
  <div class="field">
    <span class="text"><span class="label label-small">Category</span><span class="value">Social</span></span>
    <i data-icon="chevron_right" class="chev"></i>
  </div>
  <div class="field">
    <span class="text"><span class="label label-small">Notes</span><span class="value hint">Optional</span></span>
  </div>
</div>

<script src="screens.js"></script>
</body>
</html>
