<script src="screens.js"></script>
<script>
  const NS = 'http://www.w3.org/2000/svg'
  const el = (tag, attrs) => {
    const node = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
    return node
  }

  /* _VaultArtPainter on a 181 × 194 hero tile. */
  const vault = document.getElementById('vault')
  const w = 181, h = 194, cx = w * 0.95, cy = h * 0.9, r = w * 0.66
  vault.innerHTML = `<defs>
      <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4f8df9"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#3730a3"/>
      </linearGradient>
      <radialGradient id="vl" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="${w * 1.1}">
        <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#vg)"/>
    <rect width="${w}" height="${h}" fill="url(#vl)"/>
    <circle cx="${cx}" cy="${cy}" r="${r * 0.5}" fill="#fff" fill-opacity=".07"/>`
  for (const [f, a, sw] of [[1, 0.14, 1.2], [0.78, 0.1, 1.0], [0.5, 0.18, 1.4]]) {
    vault.append(el('circle', { cx, cy, r: r * f, fill: 'none', stroke: '#fff', 'stroke-opacity': a, 'stroke-width': sw }))
  }
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0
    const ang = (i * 2 * Math.PI) / 60
    const from = r * (major ? 0.83 : 0.87), to = r * 0.94
    vault.append(el('line', {
      x1: cx + Math.cos(ang) * from, y1: cy + Math.sin(ang) * from,
      x2: cx + Math.cos(ang) * to, y2: cy + Math.sin(ang) * to,
      stroke: '#fff', 'stroke-opacity': major ? 0.32 : 0.14, 'stroke-width': major ? 1.6 : 1.0,
    }))
  }
  vault.append(el('circle', { cx, cy: cy - r * 0.64, r: 3.5, fill: '#fff', 'fill-opacity': 0.55 }))

  /* _TileArtPainter._fingerprint: broken half-rings around (132, 100). */
  const fp = document.getElementById('fingerprint-art')
  const gaps = [[[0, 1]], [[0, 0.4], [0.47, 1]], [[0, 0.3], [0.38, 0.75]]]
  for (let i = 0; i < 7; i++) {
    const rad = 10 + i * 8
    for (const [from, to] of gaps[i % 3]) {
      const a1 = Math.PI + from * Math.PI, a2 = Math.PI + to * Math.PI
      const p = (a) => `${132 + rad * Math.cos(a)} ${100 + rad * Math.sin(a)}`
      fp.append(el('path', { d: `M${p(a1)} A${rad} ${rad} 0 0 1 ${p(a2)}`, style: 'stroke-width:1.5' }))
    }
  }
</script>
</body>
</html>
