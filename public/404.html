<!doctype html>
<!-- GitHub Pages shows this for any address that does not exist. Self-contained on purpose. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found · MyStuff</title>
    <link rel="icon" href="/mystuff/favicon.ico" sizes="48x48" />
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; src: url('/mystuff/fonts/PlusJakartaSans-Medium.ttf') format('truetype'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 800; src: url('/mystuff/fonts/PlusJakartaSans-ExtraBold.ttf') format('truetype'); }
      :root { --bg: #fbfbfe; --text: #0b0b0f; --muted: #6b6b75; --accent: #2563eb; }
      :root[data-theme='dark'] { --bg: #05060b; --text: #f5f5f7; --muted: #8e8e96; --accent: #3b82f6; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 20px; text-align: center; }
      img { border-radius: 24%; }
      h1 { margin: 8px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
      a { margin-top: 10px; display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 13px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/mystuff/icon-192.png" width="64" height="64" alt="" />
      <h1>Page not found</h1>
      <p>This page does not exist.</p>
      <a href="/mystuff/">Go to MyStuff</a>
    </main>
  </body>
</html>
